pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Match the mod id so the distributable JAR has a clear name.
rootProject.name = 'obsidium'


// Optional railway addon, distributed as its own JAR.
include 'addons:mythic_rails'
