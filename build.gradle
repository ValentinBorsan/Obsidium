plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Modmuss50"
		url = "https://maven.modmuss50.me/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"obsidium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	modImplementation "teamreborn:energy:4.1.0"
	include "teamreborn:energy:4.1.0"
	
	// REI for recipe viewing
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:16.0.777"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:16.0.777"
	modCompileOnly "dev.architectury:architectury-fabric:13.0.6"
	modCompileOnly "me.shedaniel.cloth:basic-math:0.6.1"
	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:16.0.777"

	// Jade (optional block tooltips / HUD overlay)
	modCompileOnly "maven.modrinth:jade:15.1.4+fabric"
	modLocalRuntime "maven.modrinth:jade:15.1.4+fabric"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("LICENSE-HISTORY.md")
	from("licenses") { into "licenses" }

}

test {
	failOnNoDiscoveredTests = false
}

// Uses the local Minecraft runtime; no additional test dependency is required.
tasks.register('storageRegressionTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.valentin.obsidium.StorageRegressionTest'
}

tasks.named('check') {
	dependsOn tasks.named('storageRegressionTest')
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
